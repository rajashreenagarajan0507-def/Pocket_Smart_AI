<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart - Budget Planners</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8ff;
            color: #172554;
        }

        nav {
            height: 72px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            text-decoration: none;
            font-size: 24px;
            font-weight: 800;
            color: #2563eb;
        }

        .logo span {
            color: #172554;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #334155;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .login-btn {
            background: #2563eb;
            color: white !important;
            padding: 11px 22px;
            border-radius: 8px;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: 55px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 45px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #64748b;
            font-size: 17px;
        }

        .planner-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .planner-card {
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 8px 28px rgba(37,99,235,0.10);
            transition: 0.2s;
        }

        .planner-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 35px rgba(37,99,235,0.16);
        }

        .icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 22px;
        }

        .planner-card h2 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .planner-card p {
            color: #64748b;
            line-height: 1.6;
            min-height: 80px;
        }

        .planner-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-weight: 700;
            margin-top: 22px;
        }

        .planner-btn:hover {
            background: #1d4ed8;
        }

        footer {
            margin-top: 80px;
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px;
        }

        footer p {
            color: #cbd5
