<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PocketSmart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef6ff, #ffffff);
            color: #172b4d;
        }

        nav {
            height: 70px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 2px 12px rgba(0, 60, 130, 0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #0866d8;
        }

        .logo span {
            color: #172b4d;
        }

        .home-link {
            text-decoration: none;
            color: #0866d8;
            font-weight: 600;
        }

        .register-wrapper {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 470px;
            background: white;
            padding: 42px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 75, 150, 0.12);
        }

        .register-card h1 {
            text-align: center;
            color: #0866d8;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #344563;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d6e2f0;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #0866d8;
            box-shadow: 0 0 0 3px rgba(8, 102, 216, 0.1);
        }

        .error {
            background: #fff0f0;
            color: #d32f2f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .register-btn {
            width: 100%;
            border: none;
            background: #0866d8;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .register-btn:hover {
            background: #0757b8;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #718096;
            font-size: 14px;
        }

        .login-text a {
            color: #0866d8;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .register-card {
                padding: 30px 22px;
            }

            .register-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            Pocket<span>Smart</span>
        </div>

        <a href="{{ url_for('index') }}" class="home-link">
            Home
        </a>
    </nav>

    <div class="register-wrapper">

        <div class="register-card">

            <h1>Create Your Account</h1>

            <p class="subtitle">
                Join PocketSmart and start planning your budget smarter.
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        required
                    >
                </div>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
