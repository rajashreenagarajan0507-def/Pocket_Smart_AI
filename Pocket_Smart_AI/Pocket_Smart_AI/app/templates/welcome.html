<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome - PocketSmart AI</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="page-container">

        <div class="welcome-card">

            <h1>💰 PocketSmart AI</h1>

            <p class="subtitle">
                Your Smart Budget & Recommendation Assistant
            </p>

            <p class="welcome-text">
                Welcome! Let's create smart recommendations
                according to your budget and requirements.
            </p>

            <form id="welcomeForm">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >

                <button type="submit">
                    Continue →
                </button>

            </form>

        </div>

    </div>

    <script>
        document.getElementById("welcomeForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const username = document.getElementById("username").value.trim();

            if (!email || !username) {
                alert("Please enter your email and username.");
                return;
            }

            localStorage.setItem("pocketEmail", email);
            localStorage.setItem("pocketUsername", username);

            window.location.href = "/planners";
        });
    </script>

</body>
</html>
