<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart - Party Budget Planner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8ff;
            color: #172554;
        }

        nav {
            height: 72px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            text-decoration: none;
            font-size: 24px;
            font-weight: 800;
            color: #2563eb;
        }

        .logo span {
            color: #172554;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #334155;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .login-btn {
            background: #2563eb;
            color: white !important;
            padding: 11px 22px;
            border-radius: 8px;
        }

        .container {
            width: 90%;
            max-width: 950px;
            margin: 50px auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .heading p {
            color: #64748b;
            font-size: 17px;
        }

        .card {
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(37,99,235,0.10);
        }

        .info-box {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 28px;
            color: #475569;
            line-height: 1.6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr
